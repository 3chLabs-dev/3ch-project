# Replace the existing SPA location / in the woorileague.com server block.
# Keep existing /api, /uploads and other service location blocks as they are.
# Test with nginx -t before reloading.
location / {
    try_files $uri $uri/index.html /app.html;
}

# app.html is the functional-page shell (noindex). Public pages have their own HTML.
location = /app.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
}
